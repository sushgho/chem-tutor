services:
  - type: web
    name: chem-tutor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-free.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDING_MODE
        value: keyword
      - key: GROQ_API_KEY
        sync: false
